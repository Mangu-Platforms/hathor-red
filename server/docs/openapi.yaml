openapi: 3.0.0
info:
  title: Hathor Red Music Platform API
  description: |
    Next-generation music streaming API with AI-powered recommendations,
    social listening rooms, and professional audio tools.
  version: 2.0.0
  contact:
    name: Hathor Team
    email: dev@hathor.dev
    url: https://github.com/redinc23/hathor-red
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:5000/api/v1
    description: Local development
  - url: https://api.hathor.dev/api/v1
    description: Production
  - url: https://staging-api.hathor.dev/api/v1
    description: Staging

security:
  - BearerAuth: []
  - OAuth2: []

tags:
  - name: Authentication
    description: User registration, login, OAuth, and token management
  - name: Songs
    description: Music streaming, upload, and management
  - name: Playlists
    description: Playlist CRUD and management
  - name: Rooms
    description: Listening rooms and real-time collaboration
  - name: AI
    description: AI-powered features (playlist generation, recommendations)
  - name: Search
    description: Semantic and hybrid search
  - name: Streaming
    description: HLS adaptive bitrate streaming
  - name: Analytics
    description: Event tracking and analytics
  - name: Health
    description: Health checks and metrics

paths:
  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        201:
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        400:
          $ref: '#/components/responses/BadRequest'
        409:
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login with username and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        200:
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        401:
          $ref: '#/components/responses/Unauthorized'

  /auth/refresh:
    post:
      tags: [Authentication]
      summary: Refresh access token
      security:
        - CookieAuth: []
      responses:
        200:
          description: Token refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken:
                    type: string
                  expiresIn:
                    type: integer
        401:
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout and invalidate tokens
      responses:
        200:
          description: Logout successful

  /auth/oauth/google:
    get:
      tags: [Authentication]
      summary: Initiate Google OAuth login
      responses:
        302:
          description: Redirect to Google

  /auth/oauth/spotify:
    get:
      tags: [Authentication]
      summary: Initiate Spotify OAuth login
      responses:
        302:
          description: Redirect to Spotify

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user profile
      responses:
        200:
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        401:
          $ref: '#/components/responses/Unauthorized'

  /songs:
    get:
      tags: [Songs]
      summary: List all songs
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Genre'
        - $ref: '#/components/parameters/Search'
      responses:
        200:
          description: List of songs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Song'

  /songs/{id}:
    get:
      tags: [Songs]
      summary: Get song by ID
      parameters:
        - $ref: '#/components/parameters/SongId'
      responses:
        200:
          description: Song details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Song'
        404:
          $ref: '#/components/responses/NotFound'

  /songs/{id}/stream:
    get:
      tags: [Streaming]
      summary: Stream song audio
      parameters:
        - $ref: '#/components/parameters/SongId'
        - name: quality
          in: query
          schema:
            type: string
            enum: [64k, 128k, 192k, 256k, 320k, lossless]
      responses:
        200:
          description: Audio stream
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary

  /songs/{id}/master.m3u8:
    get:
      tags: [Streaming]
      summary: Get HLS master manifest
      parameters:
        - $ref: '#/components/parameters/SongId'
      responses:
        200:
          description: HLS master manifest
          content:
            application/vnd.apple.mpegurl:
              schema:
                type: string

  /search/semantic:
    post:
      tags: [Search]
      summary: Semantic vector search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                limit:
                  type: integer
                  default: 20
                threshold:
                  type: number
                  default: 0.7
      responses:
        200:
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SearchResult'

  /search/hybrid:
    get:
      tags: [Search]
      summary: Hybrid vector + text search
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: genres
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        200:
          description: Search results

  /ai/playlist:
    post:
      tags: [AI]
      summary: Generate AI playlist from natural language
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  example: "songs for a rainy Sunday morning"
                songCount:
                  type: integer
                  default: 20
                stream:
                  type: boolean
                  default: false
      responses:
        200:
          description: Generated playlist
          content:
            application/json:
              schema:
                type: object
                properties:
                  playlist:
                    $ref: '#/components/schemas/Playlist'
                  analysis:
                    type: object

  /ai/chat:
    post:
      tags: [AI]
      summary: Chat with AI music assistant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                stream:
                  type: boolean
                  default: false
      responses:
        200:
          description: AI response
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string

  /rooms:
    get:
      tags: [Rooms]
      summary: List listening rooms
      responses:
        200:
          description: List of rooms
    post:
      tags: [Rooms]
      summary: Create a listening room
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                isPublic:
                  type: boolean
      responses:
        201:
          description: Room created

  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        200:
          description: Service healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  uptime:
                    type: number

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      responses:
        200:
          description: Prometheus format metrics
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    CookieAuth:
      type: apiKey
      in: cookie
      name: refresh_token
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /api/v1/auth/oauth/google
          tokenUrl: /api/v1/auth/oauth/google/callback
          scopes:
            profile: Access profile information
            email: Access email address

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
        displayName:
          type: string
        avatarUrl:
          type: string
        role:
          type: string
          enum: [listener, artist, admin]

    Song:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        album:
          type: string
        duration:
          type: integer
        genre:
          type: string
        coverUrl:
          type: string

    Playlist:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        isPublic:
          type: boolean

    RegisterRequest:
      type: object
      required: [username, email, password]
      properties:
        username:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        displayName:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
        user:
          $ref: '#/components/schemas/User'

    SearchResult:
      type: object
      properties:
        song:
          $ref: '#/components/schemas/Song'
        similarity:
          type: number

  parameters:
    SongId:
      name: id
      in: path
      required: true
      schema:
        type: integer

    Page:
      name: page
      in: query
      schema:
        type: integer
        default: 1

    Limit:
      name: limit
      in: query
      schema:
        type: integer
        default: 20

    Genre:
      name: genre
      in: query
      schema:
        type: string

    Search:
      name: q
      in: query
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Conflict:
      description: Resource conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        statusCode:
          type: integer