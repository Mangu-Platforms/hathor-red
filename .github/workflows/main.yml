name: Hardcore Multi-Agent Swarm

on:
  schedule:
    - cron: '0 2 * * *' # Aggressive: Runs every single day at 2 AM
  workflow_dispatch:
    inputs:
      intensity:
        description: 'How hard should they work? (Deep scan vs quick sweep)'
        default: 'Maximum Effort: Refactor, optimize, secure, and test everything.'
        required: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  multi-agent-orchestration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Tooling & AI Frameworks
        run: |
          python -m pip install --upgrade pip
          # Installing aider for coding, radon for complexity scanning, bandit for security scanning
          pip install aider-chat radon bandit pytest coverage

      - name: Generate Code Health Hit-List
        id: scan
        run: |
          echo "Scanning for complex code..."
          radon cc . -a > complexity_report.txt || true
          echo "Scanning for security flaws..."
          bandit -r . -f txt -o security_report.txt || true
          echo "Hit-list generated."

      - name: 🕵️‍♂️ Agent 1: The Security Auditor
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config --global user.name "Security-Agent[bot]"
          git config --global user.email "security-agent@users.noreply.github.com"
          BRANCH_NAME="swarm-optimization-${{ github.run_id }}"
          git checkout -b $BRANCH_NAME

          aider --message "Act as a ruthless Security Auditor. Read 'security_report.txt'. Fix all security vulnerabilities, patch injection flaws, and ensure secure data handling. Do not break existing functionality." --yes --auto-commits

      - name: ⚡ Agent 2: The Performance Architect
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config --global user.name "Performance-Agent[bot]"
          git config --global user.email "perf-agent@users.noreply.github.com"
          
          aider --message "Act as a highly critical Performance Architect. Read 'complexity_report.txt'. Refactor the most complex functions to be modular, optimize algorithms for speed, and reduce memory footprint." --yes --auto-commits

      - name: 🧪 Agent 3: The QA Engineer
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config --global user.name "QA-Agent[bot]"
          git config --global user.email "qa-agent@users.noreply.github.com"
          
          aider --message "Act as a paranoid QA Engineer. Look at the changes made by the Security and Performance agents. Write exhaustive unit tests and edge-case coverage for all modified files. Ensure no functionality was broken." --yes --auto-commits

      - name: 🧠 Agent 4: The Lead Architect (Review & Polish)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git config --global user.name "Lead-Architect[bot]"
          git config --global user.email "lead-architect@users.noreply.github.com"
          
          aider --message "Act as the Lead Architect. Review all changes made by the team today. Enforce strict code style, add comprehensive Docstrings and inline comments, and ensure the codebase is absolutely pristine." --yes --auto-commits

      - name: Run Final Validation Suite
        run: |
          if [ -d "tests" ]; then
            pytest --maxfail=1 --disable-warnings -q || echo "Tests failed, but proceeding to PR for human review."
          fi

      - name: Open Mega-PR from the Swarm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="swarm-optimization-${{ github.run_id }}"
          git push origin $BRANCH_NAME

          gh pr create \
            --title "🚀 Agent Swarm: Massive Codebase Overhaul & Optimization" \
            --body "### The Swarm has finished its work.
            
            **Agents Deployed:**
            1. 🕵️‍♂️ **Security Auditor:** Patched vulnerabilities based on static analysis.
            2. ⚡ **Performance Architect:** Refactored complex logic for speed and modularity.
            3. 🧪 **QA Engineer:** Generated tests for the new architecture.
            4. 🧠 **Lead Architect:** Polished, documented, and standardized the code.
            
            **Intensity level:** ${{ github.event.inputs.intensity || 'Daily Maximum Effort' }}" \
            --head $BRANCH_NAME \
            --base main
