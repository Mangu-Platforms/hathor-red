name: Security Scan

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.9.0

      - name: Setup Node.js 18.17.0
        uses: actions/setup-node@v4
        with:
          node-version: '18.17.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Snyk: dependency vulnerability check.
      # continue-on-error: we want the scan to report but not block merges
      # until the SNYK_TOKEN secret is configured.
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # Trivy: filesystem + secret scan.
      # Pinned by full commit SHA (v0.36.0): trivy-action re-tagged with a
      # v-prefix after a supply-chain incident, which orphaned the old
      # `0.28.0` tag and made this job fail at action-resolution time.
      - name: Run Trivy (vuln + secret)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret'
        env:
          TRIVY_EXIT_CODE: '1'
